<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alexander Loker</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script defer src="/_vercel/insights/script.js"></script>
<script defer src="/_vercel/speed-insights/script.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:#fff;font-family:'Space Mono',monospace;color:#111;
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:40px 22px;overflow-x:hidden;
  }
  .name,.status,.blurb{overflow-wrap:break-word}
  .wrap{max-width:640px;width:100%;min-width:0;text-align:center;animation:fadeUp .8s ease forwards}
  @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

  .name{
    font-family:'Anton',sans-serif;font-size:clamp(40px,8vw,88px);
    color:#F5C518;letter-spacing:4px;text-transform:uppercase;line-height:1;
    text-shadow:2px 2px 0 rgba(0,0,0,.07);
  }
  .rule{
    height:2px;background:#111;width:64px;margin:26px auto;
  }
  .status{
    font-family:'Anton',sans-serif;font-size:clamp(15px,2.4vw,20px);
    letter-spacing:5px;text-transform:uppercase;color:#111;
  }
  .blurb{
    font-size:clamp(11.5px,3vw,13px);line-height:1.9;color:#666;letter-spacing:.5px;
    margin-top:20px;overflow-wrap:break-word;
  }
  .contact{
    display:inline-block;margin-top:32px;font-family:'Anton',sans-serif;
    font-size:14px;color:#FF6B35;text-decoration:none;
    letter-spacing:3px;text-transform:uppercase;border:2px solid #FF6B35;
    padding:9px 22px;transition:all .3s ease;
  }
  .contact:hover{background:#FF6B35;color:#fff}
</style>
</head>
<body>

<div class="wrap">
  <h1 class="name">Alexander Loker</h1>
  <div class="rule"></div>
  <p class="status">Under Construction</p>
  <p class="blurb">
    This site is being rebuilt and is temporarily offline.
    Thanks for stopping by, please check back soon.
  </p>
  <a class="contact" href="mailto:lokeralexander@gmail.com">Get in touch</a>
</div>

</body>
</html>
